apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
  - name: Zipkin
    uid: zipkin
    type: zipkin
    url: http://zipkin:9411
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      # "traceId=..." in a log line becomes a link to that trace in Zipkin.
      derivedFields:
        - name: traceId
          matcherRegex: "traceId=(\\w+)"
          url: "$${__value.raw}"
          datasourceUid: zipkin
