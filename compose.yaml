# docker compose up -d                 -> infrastructure only: MySQL, Redis, Kafka, Debezium (run services from the IDE)
# docker compose --profile app up -d   -> everything, after ./gradlew bootJar
name: ecommerce

x-service: &service
  profiles: [ app ]
  restart: on-failure
  # With a limit, the image's -XX:MaxRAMPercentage=75 gives each JVM a ~576 MB heap ceiling.
  mem_limit: 768m
  environment:
    CONFIG_SERVER_URL: http://config-server:8888
    EUREKA_URL: http://discovery-server:8761/eureka/
    MYSQL_HOST: mysql
    MYSQL_PORT: 3306
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    LOKI_URL: http://loki:3100/loki/api/v1/push
    SPRING_PROFILES_ACTIVE: loki
    REDIS_HOST: redis
    REDIS_PORT: 6379
  depends_on: &service-deps
    config-server:
      condition: service_healthy
    discovery-server:
      condition: service_healthy
    # The outbox relay must be registered before services write their first message.
    connect-init:
      condition: service_completed_successfully

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    # 3307 on the host so it does not clash with a locally installed MySQL on 3306.
    ports: [ "3307:3306" ]
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    # 6380 on the host so it does not clash with a locally installed Redis on 6379.
    ports: [ "6380:6379" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    # Single node in KRaft mode (no ZooKeeper).
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    # Host clients (services run from the IDE) use localhost:29092.
    ports: [ "29092:29092" ]
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null" ]
      interval: 5s
      retries: 30

  # Debezium on Kafka Connect: reads the outbox tables from the MySQL binlog and publishes them (ADR-0003).
  connect:
    image: quay.io/debezium/connect:3.0.8.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
    # 18083 on the host: 8083 is inventory-service's port when it runs from the IDE.
    ports: [ "18083:8083" ]
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:8083/connectors > /dev/null" ]
      interval: 5s
      retries: 40

  connect-init:
    image: curlimages/curl:8.11.1
    entrypoint: [ "/bin/sh", "/debezium/register.sh" ]
    volumes:
      - ./docker/debezium:/debezium:ro
    depends_on:
      connect:
        condition: service_healthy

  # Search read model (ADR-0011). Image = official 8.18 + Nori (docker/elasticsearch/Dockerfile).
  elasticsearch:
    build: docker/elasticsearch
    image: ecommerce-elasticsearch:8.18.8
    environment:
      discovery.type: single-node
      # Local only. A real cluster keeps security on (TLS + credentials).
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 1536m
    ports: [ "9200:9200" ]
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow\\&timeout=1s > /dev/null" ]
      interval: 5s
      retries: 40

  # ---- observability (ADR-0010): traces, metrics, logs
  zipkin:
    image: openzipkin/zipkin:3.4
    ports: [ "9411:9411" ]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: [ "9090:9090" ]

  loki:
    image: grafana/loki:3.3.2
    # 13100 on the host: 3100 is often taken by local dev servers. Services push to loki:3100 inside the network.
    ports: [ "13100:3100" ]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ecommerce-overview.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: [ "3000:3000" ]
    depends_on: [ prometheus, loki, zipkin ]

  discovery-server:
    profiles: [ app ]
    build: { context: ., dockerfile: docker/Dockerfile, args: { MODULE: infra/discovery-server } }
    ports: [ "8761:8761" ]
    healthcheck: &health
      test: [ "CMD-SHELL", "curl -fs http://localhost:$${SERVER_PORT}/actuator/health || exit 1" ]
      interval: 5s
      retries: 30
    environment:
      SERVER_PORT: 8761

  config-server:
    profiles: [ app ]
    build: { context: ., dockerfile: docker/Dockerfile, args: { MODULE: infra/config-server } }
    ports: [ "8888:8888" ]
    volumes:
      - ./config-repo:/config-repo:ro
    environment:
      SERVER_PORT: 8888
      CONFIG_REPO: file:/config-repo/
    healthcheck: *health

  gateway:
    <<: *service
    build: { context: ., dockerfile: docker/Dockerfile, args: { MODULE: infra/gateway } }
    # The only port open to the outside: every API call goes through the gateway.
    ports: [ "8000:8000" ]

  user-service:
    <<: *service
    build: { context: ., dockerfile: docker/Dockerfile, args: { MODULE: services/user-service } }
    depends_on:
      <<: *service-deps
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  product-service:
    <<: *service
    build: { context: ., dockerfile: docker/Dockerfile, args: { MODULE: services/product-service } }
    depends_on:
      <<: *service-deps
      mysql:
        condition: service_healthy

  inventory-service:
    <<: *service
    build: { context: ., dockerfile: docker/Dockerfile, args: { MODULE: services/inventory-service } }
    depends_on:
      <<: *service-deps
      mysql:
        condition: service_healthy

  order-service:
    <<: *service
    build: { context: ., dockerfile: docker/Dockerfile, args: { MODULE: services/order-service } }
    depends_on:
      <<: *service-deps
      mysql:
        condition: service_healthy

  coupon-service:
    <<: *service
    build: { context: ., dockerfile: docker/Dockerfile, args: { MODULE: services/coupon-service } }
    depends_on:
      <<: *service-deps
      mysql:
        condition: service_healthy

  payment-service:
    <<: *service
    build: { context: ., dockerfile: docker/Dockerfile, args: { MODULE: services/payment-service } }
    depends_on:
      <<: *service-deps
      mysql:
        condition: service_healthy

  search-service:
    <<: *service
    build: { context: ., dockerfile: docker/Dockerfile, args: { MODULE: services/search-service } }
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
      LOKI_URL: http://loki:3100/loki/api/v1/push
      SPRING_PROFILES_ACTIVE: loki
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      <<: *service-deps
      elasticsearch:
        condition: service_healthy

volumes:
  mysql-data:
  kafka-data:
  es-data:
