# Settings that are part of how the service works live here.
# Settings that change per environment live in config-repo/product-service.yml.
server:
  port: 8082
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: product-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        # Stable JSON for Page responses (content + page metadata) instead of serializing PageImpl.
        serialization-mode: via_dto
        max-page-size: 100

# Without config-server (tests, a bare run) nothing is sampled; config-repo turns sampling on per environment.
management:
  tracing:
    sampling:
      probability: 0.0
