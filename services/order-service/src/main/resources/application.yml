# Settings that are part of how the service works live here.
# Settings that change per environment live in config-repo/order-service.yml.
server:
  port: 8084
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: order-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  kafka:
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
    listener:
      # Commit each record's offset after its handler (and its DB transaction) finished.
      ack-mode: record
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        # Stable JSON for Page responses (content + page metadata) instead of serializing PageImpl.
        serialization-mode: via_dto
        max-page-size: 100

# Fault isolation for the product lookup (client/ProductCatalog). 4xx answers are business results, not failures.
resilience4j:
  circuitbreaker:
    instances:
      product:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 1s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.RestClientException
        ignore-exceptions:
          - com.ecommerce.order.client.DownstreamException
  retry:
    instances:
      product:
        max-attempts: 2
        wait-duration: 100ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - com.ecommerce.order.client.DownstreamException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
  bulkhead:
    instances:
      product:
        max-concurrent-calls: 50
        max-wait-duration: 0
