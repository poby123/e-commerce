# Settings that are part of how the service works live here.
# Settings that change per environment live in config-repo/inventory-service.yml.
server:
  port: 8083
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: inventory-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  kafka:
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
    listener:
      # Commit each record's offset after its handler (and its DB transaction) finished.
      ack-mode: record
      # A consumer span per record, continuing the trace from the record's traceparent header.
      observation-enabled: true
    template:
      observation-enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

# Without config-server (tests, a bare run) nothing is sampled; config-repo turns sampling on per environment.
management:
  tracing:
    sampling:
      probability: 0.0
