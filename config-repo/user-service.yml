spring:
  # Defaults point at the compose containers as seen from the host (MySQL 3307, Redis 6380).
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/user_db
    username: user_svc
    # Local dev only. A real deployment reads secrets from Vault / a secret manager, not from this repo.
    password: ${USER_DB_PASSWORD:user_svc_pw}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

ecommerce:
  jwt:
    access-token-ttl: 15m
    refresh-token-ttl: 14d
    # Local dev: a key generated at startup. Anywhere with more than one instance, mount a fixed key instead:
    #   private-key-location: file:./secrets/jwt-private.pem   (scripts/generate-jwt-key.sh)
    allow-generated-key: true
