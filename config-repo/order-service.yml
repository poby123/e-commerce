spring:
  # Defaults point at the compose MySQL as seen from the host (port 3307).
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/order_db
    username: order_svc
    # Local dev only. A real deployment reads secrets from Vault / a secret manager, not from this repo.
    password: ${ORDER_DB_PASSWORD:order_svc_pw}

ecommerce:
  clients:
    product:
      # Timeout budget: 1 s x 2 attempts (retry) + 100 ms < the gateway's 5 s response timeout, so order-service
      # answers its own 503 (ORDER-005) before the gateway gives up on it (troubleshooting #9).
      read-timeout: 1s
  saga:
    # No reply within this time: resend the step's command (receivers are idempotent), up to max-attempts sends,
    # then compensate. tok_slow (15 s at the mock PG) shows a retry that still completes.
    step-timeout: 10s
    max-attempts: 3
