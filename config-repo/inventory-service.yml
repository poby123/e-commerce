spring:
  # Defaults point at the compose MySQL as seen from the host (port 3307).
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/inventory_db
    username: inventory_svc
    # Local dev only. A real deployment reads secrets from Vault / a secret manager, not from this repo.
    password: ${INVENTORY_DB_PASSWORD:inventory_svc_pw}
