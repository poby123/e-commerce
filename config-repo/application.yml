# Shared by every service that imports from config-server.
spring:
  threads:
    virtual:
      enabled: true
  kafka:
    # Consumer group and ack mode are part of how each service works: see the services' application.yml.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
  cloud:
    loadbalancer:
      cache:
        # Default 35s. With the 30s registry fetch, a new instance could take ~1 min to receive traffic.
        ttl: 5s

eureka:
  client:
    # Defaults (30s) favour a quiet registry over fast discovery; local dev wants the opposite.
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Buckets so Prometheus can compute p95/p99 across instances (histogram_quantile).
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      # Every request in this environment; production would sample a fraction (and keep all errors).
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

ecommerce:
  jwt:
    issuer: ecommerce-auth
