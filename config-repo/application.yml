# Shared by every service that imports from config-server.
spring:
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
    listener:
      # Commit each record's offset after its handler (and its DB transaction) finished.
      ack-mode: record
  cloud:
    loadbalancer:
      cache:
        # Default 35s. With the 30s registry fetch, a new instance could take ~1 min to receive traffic.
        ttl: 5s

eureka:
  client:
    # Defaults (30s) favour a quiet registry over fast discovery; local dev wants the opposite.
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

ecommerce:
  jwt:
    issuer: ecommerce-auth
