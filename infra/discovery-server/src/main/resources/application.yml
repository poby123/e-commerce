server:
  port: 8761
  shutdown: graceful   # finish in-flight requests on SIGTERM (rolling updates, k8s pod deletion)

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: discovery-server

eureka:
  client:
    # A single standalone registry: it does not register with or fetch from a peer.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Local development restarts services all the time; self-preservation would keep dead instances listed.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
